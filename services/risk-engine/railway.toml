# Config-as-code for the risk-engine Railway service.
# Create the service with Root Directory = services/risk-engine.
# See deploy/railway.md.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/alerts/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
